---
name: Build

on:
  pull_request:

concurrency:
  group: ${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build bootc container as the runner user
        run: |
          podman build --pull=always \
            --build-arg "FDI_VERSION=ci-${GITHUB_SHA}" \
            --build-arg "FDI_RELEASE=${GITHUB_RUN_NUMBER}" \
            -t localhost/fdi:ci .
      - name: Check container defaults and runtime dependencies
        run: |
          podman run --rm localhost/fdi:ci /bin/bash -euxo pipefail -c '
            test "$(uname -m)" = x86_64
            passwd -S root | grep -q " L "
            test "$(systemctl is-enabled sshd.service)" = disabled
            test "$(systemctl is-enabled discovery-menu.service)" = enabled
            test "$(readlink /opt/extension)" = /var/opt/extension
            test -s /usr/PACKAGES-LIST
            test -s /usr/lib/modules/*/initramfs.img
            bash -n /usr/bin/nm-configure /usr/bin/nm-prepare /usr/bin/discovery-debug
            ruby -r discovery -r newt -e "puts RUBY_VERSION"
            for tool in lspci dmidecode ethtool lldptool ipmitool parted kexec; do
              command -v "$tool"
            done
          '
      - name: Check FDI command-line overrides and network profiles
        run: podman run --rm -i localhost/fdi:ci /bin/bash < test/cmdline.sh
      - name: Check EL10 extension network helpers
        run: podman run --rm -i localhost/fdi:ci /bin/bash < test/network-helpers.sh
      - name: Check repeated fact registration with Ruby 3.3
        run: podman run --rm -i --network none localhost/fdi:ci ruby < test/register_cache.rb
      - name: Export OCI archive
        run: podman save --format oci-archive --output fdi.oci localhost/fdi:ci
      - name: Archive container
        uses: actions/upload-artifact@v5
        with:
          name: fdi-bootc-oci
          path: fdi.oci
          compression-level: 0
          retention-days: 15
